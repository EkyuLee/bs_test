<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법령 검색기</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --sub:#6b7385; --line:#e3e6ec; --accent:#1f5eff; --hl:#fff3b0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 12px; font-size:18px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  select, input, button { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  input[type=search] { flex:1; min-width:220px; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  label.chk { display:flex; align-items:center; gap:4px; font-size:14px; color:var(--sub); }
  main { display:grid; grid-template-columns: 380px 1fr; gap:16px; padding:16px 24px; height:calc(100vh - 110px); }
  .pane { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:auto; }
  .meta { padding:10px 14px; font-size:13px; color:var(--sub); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); }
  .item { padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.on { background:#eef3ff; }
  .item .t { font-weight:600; font-size:15px; }
  .item .s { font-size:12px; color:var(--sub); margin-top:4px; }
  .pager { display:flex; justify-content:space-between; padding:10px 14px; }
  .pager button { padding:6px 12px; }
  #detail { padding:20px 26px; }
  #detail h2 { margin:0 0 6px; font-size:20px; }
  #detail .info { color:var(--sub); font-size:13px; margin-bottom:14px; }
  .tools { display:flex; gap:8px; margin-bottom:14px; position:sticky; top:-20px; background:var(--card); padding:8px 0; }
  .tools input { flex:1; }
  .art { padding:10px 0; border-bottom:1px dashed var(--line); white-space:pre-wrap; line-height:1.7; font-size:15px; }
  .art.head { font-weight:700; color:var(--accent); border-bottom:none; padding-top:18px; }
  .sec h3 { font-size:15px; margin:18px 0 6px; color:var(--accent); }
  .sec div { white-space:pre-wrap; line-height:1.7; font-size:15px; }
  mark { background:var(--hl); }
  .empty { color:var(--sub); padding:40px; text-align:center; }
  .err { color:#c0392b; white-space:pre-wrap; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; height:auto; } .pane { max-height:70vh; } }
</style>
</head>
<body>
<header>
  <h1>국가법령정보 검색기 <small style="color:var(--sub);font-weight:400">법제처 OPEN API</small></h1>
  <form id="f">
    <select id="target">
      <option value="law">법령</option>
      <option value="admrul">행정규칙</option>
      <option value="prec">판례</option>
      <option value="expc">법령해석례</option>
    </select>
    <input id="q" type="search" placeholder="예: 공항시설법, 산업안전보건, 중대재해" required>
    <label class="chk"><input id="body" type="checkbox"> 본문검색</label>
    <input id="oc" type="password" placeholder="API 키 (비우면 기본키)" style="width:170px" title="직접 입력한 키는 브라우저에만 저장됩니다">
    <button>검색</button>
  </form>
</header>

<main>
  <section class="pane" id="list"><div class="empty">검색어를 입력하세요.</div></section>
  <section class="pane" id="detail"><div class="empty">왼쪽 목록에서 항목을 선택하세요.</div></section>
</main>

<script>
// 검색 대상별 응답 구조 매핑
const MAP = {
  law:    { root:'LawSearch',   item:'law',    title:'법령명한글', id:'법령일련번호',
            sub: x => [x.법령구분명, x.소관부처명, '시행 ' + fmt(x.시행일자)] },
  admrul: { root:'AdmRulSearch',item:'admrul', title:'행정규칙명', id:'행정규칙일련번호',
            sub: x => [x.행정규칙종류, x.소관부처명, '시행 ' + fmt(x.시행일자)] },
  prec:   { root:'PrecSearch',  item:'prec',   title:'사건명',     id:'판례일련번호',
            sub: x => [x.법원명, x.사건번호, x.선고일자] },
  expc:   { root:'Expc',        item:'expc',   title:'안건명',     id:'법령해석례일련번호',
            sub: x => [x.질의기관명, x.안건번호, '회신 ' + x.회신일자] },
};
// 상세 화면에서 먼저 보여줄 항목 순서
const ORDER = ['판시사항','판결요지','참조조문','참조판례','질의요지','회답','이유','판례내용'];

const $ = s => document.querySelector(s);
const arr = v => v == null ? [] : Array.isArray(v) ? v : [v];
const fmt = d => (d && /^\d{8}$/.test(d)) ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6)}` : (d || '');
const clean = s => String(s ?? '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = { target:'law', query:'', page:1, total:0 };

$('#f').addEventListener('submit', e => {
  e.preventDefault();
  state = { target:$('#target').value, query:$('#q').value.trim(), page:1, body:$('#body').checked };
  search();
});

// GitHub Pages 등 정적 호스팅용: 서버 없이 법제처 API를 직접 호출 (CORS 허용됨)
const BASE = 'https://www.law.go.kr/DRF/';
const ocInput = $('#oc');
// 기본 키: 소스에 평문으로 보이지 않도록 난독화 (※ 보안 수단은 아님 — 요청 URL에는 원래 키가 보임)
const _k = (e, s) => [...atob(e)].map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ s.charCodeAt(i % s.length))).join('');
const DEFAULT_OC = _k('JSQtJlQaXFFGXQ==', 'iafmc-law');
try { ocInput.value = localStorage.getItem('law_oc') || ''; } catch (e) {}
ocInput.addEventListener('change', () => { try { localStorage.setItem('law_oc', ocInput.value.trim()); } catch (e) {} });

async function api(path) {
  const oc = ocInput.value.trim() || DEFAULT_OC;
  const url = BASE + path.replace('/api/search?', 'lawSearch.do?').replace('/api/detail?', 'lawService.do?')
                         .replace(/([?&])id=/, state.target === 'law' ? '$1MST=' : '$1ID=')
            + '&type=JSON&OC=' + encodeURIComponent(oc);
  const r = await fetch(url);
  const txt = await r.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('API 응답 오류: ' + txt.slice(0, 300)); }
  if (j.error) throw new Error(j.error + (j.raw ? '\n' + j.raw : ''));
  return j;
}

async function search() {
  const m = MAP[state.target];
  $('#list').innerHTML = '<div class="empty">검색 중…</div>';
  try {
    const p = new URLSearchParams({ target:state.target, query:state.query, page:state.page, display:20 });
    if (state.body) p.set('search', '2');
    const j = await api('/api/search?' + p);
    const root = j[m.root] || {};
    const items = arr(root[m.item]);
    state.total = +root.totalCnt || 0;
    if (!items.length) { $('#list').innerHTML = '<div class="empty">결과가 없습니다.</div>'; return; }
    const pages = Math.ceil(state.total / 20);
    $('#list').innerHTML =
      `<div class="meta">총 ${state.total.toLocaleString()}건 · ${state.page}/${pages} 페이지</div>` +
      items.map(x => `<div class="item" data-id="${esc(String(x[m.id]))}">
          <div class="t">${esc(clean(x[m.title]))}</div>
          <div class="s">${esc(m.sub(x).filter(Boolean).join(' · '))}</div></div>`).join('') +
      `<div class="pager"><button ${state.page<=1?'disabled':''} data-go="-1">이전</button>
                          <button ${state.page>=pages?'disabled':''} data-go="1">다음</button></div>`;
  } catch (e) { $('#list').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

$('#list').addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { state.page += +go.dataset.go; return search(); }
  const it = e.target.closest('.item');
  if (!it) return;
  document.querySelectorAll('.item.on').forEach(n => n.classList.remove('on'));
  it.classList.add('on');
  detail(it.dataset.id);
});

async function detail(id) {
  $('#detail').innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    const j = await api(`/api/detail?target=${state.target}&id=${encodeURIComponent(id)}`);
    state.target === 'law' ? renderLaw(j) : renderGeneric(j);
  } catch (e) { $('#detail').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

// 조문 → 항 → 호 → 목 을 순서대로 텍스트로 펼침
function flatten(node, out = []) {
  if (node == null) return out;
  if (typeof node === 'string') { const t = clean(node); if (t) out.push(t); return out; }
  if (Array.isArray(node)) { node.forEach(n => flatten(n, out)); return out; }
  // '...내용'(조문/항/호/목 본문)을 먼저, 그 다음 하위 항→호→목 순서로
  for (const [k, v] of Object.entries(node)) if (k.endsWith('내용')) flatten(v, out);
  for (const k of ['항','호','목']) if (node[k]) flatten(node[k], out);
  return out;
}

function renderLaw(j) {
  const L = j.법령; if (!L) return renderGeneric(j);
  const b = L.기본정보 || {};
  const arts = arr(L.조문?.조문단위);
  $('#detail').innerHTML = `
    <h2>${esc(b.법령명_한글 || '')}</h2>
    <div class="info">${esc([b.법종구분?.content, b.소관부처?.content, '공포 ' + fmt(b.공포일자), '시행 ' + fmt(b.시행일자), b.제개정구분].filter(Boolean).join(' · '))}</div>
    <div class="tools"><input id="find" type="search" placeholder="이 법령 안에서 찾기 (예: 과태료, 허가)"><span id="cnt" style="align-self:center;color:var(--sub);font-size:13px"></span></div>
    <div id="arts">${arts.map(a => {
      const text = flatten(a).join('\n');
      return `<div class="art ${a.조문여부 === '전문' ? 'head' : ''}">${esc(text)}</div>`;
    }).join('')}</div>`;
  $('#find').addEventListener('input', e => filterArts(e.target.value.trim()));
}

function filterArts(word) {
  let n = 0;
  document.querySelectorAll('#arts .art').forEach(el => {
    const raw = el.textContent;
    if (!word) { el.style.display = ''; el.innerHTML = esc(raw); return; }
    const hit = raw.includes(word);
    el.style.display = hit ? '' : 'none';
    if (hit) { n++; el.innerHTML = esc(raw).split(esc(word)).join(`<mark>${esc(word)}</mark>`); }
  });
  $('#cnt').textContent = word ? `${n}개 조문` : '';
}

function renderGeneric(j) {
  const obj = j[Object.keys(j)[0]] || {};
  const title = obj.사건명 || obj.안건명 || obj.행정규칙기본정보?.행정규칙명 || '상세';
  const keys = Object.keys(obj);
  const sorted = [...ORDER.filter(k => keys.includes(k)), ...keys.filter(k => !ORDER.includes(k))];
  const secs = sorted.filter(k => !/기본정보|코드|일련번호|첨부/.test(k)).map(k => {
    const txt = flatten(typeof obj[k] === 'object' && !Array.isArray(obj[k]) ? Object.values(obj[k]) : obj[k]).join('\n');
    if (!txt || txt.length < 2 || /^\d+$/.test(txt)) return '';
    return `<div class="sec"><h3>${esc(k)}</h3><div>${esc(txt)}</div></div>`;
  }).join('');
  $('#detail').innerHTML = `<h2>${esc(clean(title))}</h2>${secs || '<div class="empty">표시할 본문이 없습니다. (일부 판례는 HTML로만 제공됩니다)</div>'}`;
}
</script>
</body>
</html>
